<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - FoxLog</title>

<style>
/* =================================================
   RESET
================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* =================================================
   ======= TELA DE COMUNICADO (NOVA) =======
   (apenas adicionada, não interfere no app)
================================================= */
.comunicado {
    position: fixed;
    inset: 0;
    background: #f2f2f2;
    display: flex;
    flex-direction: column;
    z-index: 999;
}

.comunicado-header {
    height: 64px;
    background: #000;
    color: #FFD700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    letter-spacing: .4px;
}

.comunicado-pdf {
    flex: 1;
    background: #e6e6e6;
}

.comunicado-pdf iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.comunicado-footer {
    height: 90px;
    background: #000;
    color: #ccc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
}

.comunicado-footer button {
    margin-top: 10px;
    padding: 10px 36px;
    background: #FFD700;
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
}

/* =================================================
   ======= LOGIN ORIGINAL (SEM ALTERAÇÃO) =======
================================================= */
body {
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Marca d’água ORIGINAL */
.logo-bg {
    position: fixed;
    inset: 0;
    background-image: url("logo.png");
    background-position: center;
    background-size: 700px;
    background-repeat: no-repeat;
    opacity: 0.05;
    pointer-events: none;
}

/* Container ORIGINAL */
.login-container {
    width: 350px;
    padding: 35px 30px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 18px;
    box-shadow: 0 0 15px rgba(255,215,0,0.3);
    text-align: center;
    animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.login-container h2 {
    color: #FFD700;
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 25px;
    text-shadow: 0 0 12px #FFD700;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border-radius: 10px;
    border: none;
    outline: none;
    margin-bottom: 20px;
    background: #fff;
    text-align: center;
}

button.login-btn {
    width: 100%;
    padding: 12px;
    background: #FFD700;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button.login-btn:hover {
    background: #FFEA00;
    transform: scale(1.03);
}

.erro {
    color: #FF4D4D;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- =================================================
     COMUNICADO (NOVO PASSO)
================================================= -->
<div class="comunicado" id="comunicado">
    <div class="comunicado-header">
        Comunicado Oficial FoxLog
    </div>

    <div class="comunicado-pdf">
        <iframe src="anuncio.pdf"></iframe>
    </div>

    <div class="comunicado-footer">
        Ao prosseguir, você declara estar ciente do comunicado acima.
        <button onclick="aceitar()">CIENTE E PROSSEGUIR</button>
    </div>
</div>

<!-- =================================================
     LOGIN (EXATAMENTE COMO ERA)
================================================= -->
<div class="logo-bg"></div>

<div class="login-container">
    <h2>🔒 Login - FoxLog</h2>

    <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="11">

    <button class="login-btn" onclick="entrar()">Entrar</button>

    <p id="erro" class="erro"></p>
</div>

<script>
function aceitar() {
    document.getElementById("comunicado").style.display = "none";
}

function entrar() {
    const cpf = document.getElementById("cpf").value.trim();
    const msg = document.getElementById("erro");

    if (cpf.length !== 11 || isNaN(cpf)) {
        msg.innerText = "CPF inválido!";
        return;
    }

    msg.innerText = "";
    localStorage.setItem("cpf", cpf);
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
