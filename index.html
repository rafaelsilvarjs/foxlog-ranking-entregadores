<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard FoxLog</title>

<style>
body {
    background: #000;
    font-family: 'Segoe UI', Arial;
    color: #fff;
    padding: 20px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 16px;
    padding: 20px;
    width: 260px;
    box-shadow: 0 0 10px rgba(255,215,0,0.2);
    margin-bottom: 20px;
}

.titulo {
    color: #FFD700;
    font-size: 14px;
    margin-bottom: 10px;
}

.valor {
    font-size: 32px;
    font-weight: bold;
}

/* BARRA */
.barra {
    width: 100%;
    height: 10px;
    background: #222;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

.barra-fill {
    height: 100%;
    border-radius: 10px;
    transition: 0.3s;
}
</style>
</head>

<body>

<h2>📊 Dashboard FoxLog</h2>

<div class="card">
    <div class="titulo">Tempo Online (%)</div>
    <div id="tempoOnline" class="valor">0%</div>

    <div class="barra">
        <div id="barraTSH" class="barra-fill" style="width:0%; background:#FF4D4D;"></div>
    </div>
</div>

<script>

// ================================
// 🔹 SIMULAÇÃO DE DADOS (SUBSTITUIR PELO SEU JSON)
// ================================
let dados = [
    { nome: "João", TSH: 80 },
    { nome: "Maria", TSH: 90 },
    { nome: "Pedro", TSH: 70 }
];


// ================================
// 🔥 CALCULO TSH (MÉDIA)
// ================================
let mediaTSH = dados.reduce((soma, item) => soma + (item["TSH"] || 0), 0) / dados.length;


// ================================
// 🎨 DEFINIR COR DINÂMICA
// ================================
let cor = "#FF4D4D"; // vermelho

if (mediaTSH >= 85) cor = "#22c55e"; // verde
else if (mediaTSH >= 70) cor = "#facc15"; // amarelo


// ================================
// 📊 EXIBIR VALOR
// ================================
document.getElementById("tempoOnline").innerHTML =
    `<span style="color:${cor};">${mediaTSH.toFixed(0)}%</span>`;

// ================================
// 📈 BARRA VISUAL
// ================================
document.getElementById("barraTSH").style.width = mediaTSH + "%";
document.getElementById("barraTSH").style.background = cor;

</script>

</body>
</html>
