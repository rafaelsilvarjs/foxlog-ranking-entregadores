<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agenda FoxLog</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="introVideoContainer" style="
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity .8s;
">

    <button id="skipIntroBtn" style="
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 14px 26px;
        font-size: 18px;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #ff8800, #ff4d00);
        border: 2px solid rgba(255,255,255,0.7);
        border-radius: 10px;
        cursor: pointer;
        z-index: 10000;
        box-shadow: 0 0 12px rgba(255,120,0,0.7);
    ">
        ⏭️ Pular
    </button>

    <button id="ativarSomBtn" style="
        position: absolute;
        bottom: 30px;
        right: 20px;
        padding: 14px 26px;
        font-size: 18px;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #ffaa00, #ff6600);
        border: 2px solid rgba(255,255,255,0.7);
        border-radius: 10px;
        cursor: pointer;
        z-index: 10000;
        display: none;
        box-shadow: 0 0 12px rgba(255,120,0,0.7);
    ">
        🔊 Ativar Som
    </button>

    <video id="introVideo" playsinline autoplay muted style="
        width: 80vw;
        height: 80vh;
        max-width: 80%;
        max-height: 80%;
        object-fit: contain;
        border-radius: 18px;
        box-shadow: 0 0 25px rgba(255,120,0,0.5);
        background: black;
">
        <source src="videos/intro.mp4" type="video/mp4">
    </video>

</div>

<div class="logo-bg"></div>

<button class="btn-sair" onclick="sair()">🔓 Sair</button>

<h1 id="mensagemTopo" class="titulo-superior"></h1>

<div class="box-nivel-topo">
    <p style="font-size:22px;">Agenda Atual:</p>
    <h2 id="nivelAtual"></h2>
</div>

<h3 id="nomeEntregador"></h3>

<div id="cards"></div>

<div id="mensagemExtras" class="mensagem-bloco"></div>

<script>

const introContainer = document.getElementById("introVideoContainer");
const video = document.getElementById("introVideo");
const skipBtn = document.getElementById("skipIntroBtn");
const ativarSomBtn = document.getElementById("ativarSomBtn");

video.addEventListener("loadeddata", () => {
    introContainer.style.display = "flex";
    video.play().catch(()=>{});
});

skipBtn.addEventListener("click", () => {
    video.muted = false;
    video.volume = 1;
    video.play();
    removerIntro();
});

ativarSomBtn.addEventListener("click", () => {
    video.muted = false;
    video.volume = 1;
    video.play().catch(()=>{});
    ativarSomBtn.style.display = "none";
});

video.addEventListener("ended", removerIntro);

function removerIntro() {
    introContainer.style.opacity = "0";
    setTimeout(() => introContainer.remove(), 800);
}

function tentarLiberarSom() {
    video.muted = false;
    video.volume = 1;

    video.play().then(() => {
        ativarSomBtn.style.display = "none";
    }).catch(() => {
        ativarSomBtn.style.display = "block";
    });
}

video.addEventListener("loadeddata", () => {
    setTimeout(tentarLiberarSom, 300);
});

ativarSomBtn.style.display = "block";


const API_URL =
 "https://script.google.com/macros/s/AKfycbwCK_46Is1Fj1rIDdsIclRh7s2TLYZM6gOaPc8U62COmgTNthXBX55z5wz7hkKgnAqEJA/exec";

async function carregarDados() {
    const cpf = localStorage.getItem("cpf");
    if (!cpf) window.location.href = "index.html";

    const response = await fetch(`${API_URL}?cpf=${cpf}`);
    const user = await response.json();

    if (user.error) {
        document.body.innerHTML = `<h1>CPF não encontrado!</h1>`;
        return;
    }

    document.getElementById("nomeEntregador").innerText = "👋 Olá, " + user.Nome;
    document.getElementById("nivelAtual").innerText = user.Nivel;

    document.getElementById("mensagemTopo").innerHTML =
        `🌟 Bem-vindo à Plataforma Oficial do Entregador FoxLog!`;

    // 🔥 ALTERAÇÃO AQUI (CORRIDAS → TSH)
    document.getElementById("cards").innerHTML = `
        <div class='card'>AR<br><b>${user.AR}%</b></div>
        <div class='card'>CAA<br><b>${user.CAA}%</b></div>
        <div class='card'>OVERTIME<br><b>${user.OVERTIME}%</b></div>
        <div class='card'>TSH<br><b>${user.TSH || 0}%</b></div>
    `;

    let bloco = "";
    const nivel = user.Nivel.toUpperCase().replace(/\s+/g, "");

    if (nivel === "SUPERFOX") {
        bloco = `
            <h2>AGENDA – SUPERFOX   - Abertura da agenda: 09h00</h2>
            <p><b>Parabéns por ter alcançado o SuperFOX, continue com os pontos chaves:</b></p>
        `;
    }

    if (nivel === "OURO") {
        bloco = `
         <h2>AGENDA – OURO - Abertura da agenda: 09h10</h2>
        `;
    }

    if (nivel === "AGENDABASE") {
        bloco = `
        <h2>AGENDA – AGENDA BASE - Abertura da agenda: 09h20</h2>
        `;
    }

    document.getElementById("mensagemExtras").innerHTML = bloco;
}

function sair() {
    localStorage.clear();
    window.location.href = "index.html";
}

let tempoLimite = 10 * 60 * 1000;
let timer = setTimeout(sair, tempoLimite);

function resetTimer() {
    clearTimeout(timer);
    timer = setTimeout(sair, tempoLimite);
}

window.addEventListener("mousemove", resetTimer);
window.addEventListener("keydown", resetTimer);
window.addEventListener("click", resetTimer);

carregarDados();
</script>

</body>
</html>
