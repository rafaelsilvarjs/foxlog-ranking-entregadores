<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agenda FoxLog</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ========================================= -->
<!--      VÍDEO DE INTRODUÇÃO + PULAR INTRO    -->
<!-- ========================================= -->
<div id="introVideoContainer" style="
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
">
    
    <!-- BOTÃO PULAR -->
    <button id="skipIntroBtn" style="
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255,255,255,0.15);
        color: white;
        padding: 10px 18px;
        border: 1px solid rgba(255,255,255,0.4);
        cursor: pointer;
        font-size: 16px;
        border-radius: 8px;
        backdrop-filter: blur(5px);
        transition: .2s;
        z-index: 10000;
    "
    onmouseover="this.style.background='rgba(255,255,255,0.3)'"
    onmouseout="this.style.background='rgba(255,255,255,0.15)'">
        ⏭️ Pular
    </button>

    <!-- VÍDEO DE INTRO -->
    <video id="introVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover;">
        <source src="videos/intro.mp4" type="video/mp4">
    </video>

</div>

<!-- ========================================= -->
<!--               CONTEÚDO NORMAL             -->
<!-- ========================================= -->

<div class="logo-bg"></div>

<button class="btn-sair" onclick="sair()">🔓 Sair</button>

<h1 id="mensagemTopo" class="titulo-superior"></h1>

<div class="box-nivel-topo">
    <p style="font-size:22px;">Agenda Atual:</p>
    <h2 id="nivelAtual"></h2>
</div>

<h3 id="nomeEntregador"></h3>

<div id="cards"></div>

<div id="mensagemExtras" class="mensagem-bloco"></div>

<script>
/* =================================================== */
/*        CONTROLE DO VÍDEO — SOM + PULAR INTRO        */
/* =================================================== */

const video = document.getElementById("introVideo");
const skipBtn = document.getElementById("skipIntroBtn");

/* 🔊 Tentativa de autoplay COM SOM */
video.volume = 1;

video.addEventListener("canplay", () => {
    video.muted = false;

    video.play().catch(() => {
        console.warn("Autoplay com som bloqueado — aguardando interação.");
    });
});

/* 🔊 Caso usuário clique em "Pular", libera som e continua execução */
skipBtn.addEventListener("click", () => {
    video.muted = false;
    video.volume = 1;
    video.play();

    removerIntro();
});

/* ❌ Remove o vídeo com fade-out */
function removerIntro() {
    const intro = document.getElementById("introVideoContainer");
    if (!intro) return;

    intro.style.transition = "opacity .8s";
    intro.style.opacity = "0";

    setTimeout(() => intro.remove(), 800);
}

/* 🎬 Quando o vídeo terminar, some */
video.addEventListener("ended", removerIntro);


/* =================================================== */
/*                SISTEMA ORIGINAL FOXLOG              */
/* =================================================== */

const API_URL =
 "https://script.google.com/macros/s/AKfycbwCK_46Is1Fj1rIDdsIclRh7s2TLYZM6gOaPc8U62COmgTNthXBX55z5wz7hkKgnAqEJA/exec";

async function carregarDados() {
    const cpf = localStorage.getItem("cpf");
    if (!cpf) window.location.href = "index.html";

    const response = await fetch(`${API_URL}?cpf=${cpf}`);
    const user = await response.json();

    if (user.error) {
        document.body.innerHTML = `<h1>CPF não encontrado!</h1>`;
        return;
    }

    document.getElementById("nomeEntregador").innerText = "👋 Olá, " + user.Nome;
    document.getElementById("nivelAtual").innerText = user.Nivel;

    document.getElementById("mensagemTopo").innerHTML =
        `🌟 Bem-vindo à Plataforma Oficial do Entregador FoxLog!`;

    document.getElementById("cards").innerHTML = `
        <div class='card'>AR<br><b>${user.AR}%</b></div>
        <div class='card'>CAA<br><b>${user.CAA}%</b></div>
        <div class='card'>OVERTIME<br><b>${user.OVERTIME}%</b></div>
        <div class='card'>Corridas Concluídas<br><b>${user.Corridas}</b></div>
    `;

    let bloco = "";
    const nivel = user.Nivel.toUpperCase().replace(/\s+/g, "");

    if (nivel === "SUPERFOX") {
        bloco = `
        <h2>AGENDA – SUPERFOX   - Abertura da agenda: 09h00</h2> <!-- ALTERADO -->

       

        <p><b>Parabéns por ter alcançado o SuperFOX, continue com os pontos chaves:</b></p>
        
        
        <ul>
       
            <li><span class="ar">AR (rotas aceitas) =</span> MAIOR OU IGUAL A <span class="valor">95%</span></li>
            <li><span class="caa">CAA (cancelamemto apos aceite) =</span> MENOR OU IGUAL A <span class="valor">1%</span></li>
            <li><span class="overtime">OVERTIME (atraso na entrega) =</span> <span class="valor">1%</span></li>
        </ul>

        <p class="aviso">
        ⚠️ LEMBRANDO QUE<br>
        Essa avaliação serve apenas para manter sua prioridade na agenda.<br>
        Não é cobrança — são orientações para melhorar seu desempenho.<br>
        Você é prestador de serviço e tem autonomia total.
        </p>

        <p>Nós Verificamos também:✴️Compromisso com as agendas;
           ✴️Média de produtividade</p>
        <p>Continue firme! 🦊🔥</p>`
        ; 
    }

    if (nivel === "OURO") {
        bloco = `
         <h2>AGENDA – OURO - Abertura da agenda: 09h10</h2> <!-- ALTERADO -->

       
          
        <p>Busque evoluir para SuperFox e tenha benefícios exclusivos!</p>

        <ul>
          
            <li><span class="ar">AR (rotas aceitas) =</span> MAIOR OU IGUAL A  <span class="valor">95%</span></li>
            <li><span class="caa">CAA (cancelamemto apos aceite) =</span> MENOR OU IGUAL A <span class="valor">1%</span></li>
            <li><span class="overtime">OVERTIME (atraso na entrega) =</span> <span class="valor">1%</span></li>
        </ul>

       <p>Nós verificamos também:✴️Compromisso com as agendas;
           ✴️Média de produtividade</p> 
        </ul>

         <p class="aviso">
        ⚠️ LEMBRANDO QUE<br>
        Essa avaliação serve apenas para manter sua prioridade na agenda.<br>
        Você é prestador de serviço e tem autonomia total.
        </p>
        `;
    }
    if (nivel === "AGENDABASE") {
    bloco = `
        <h2>AGENDA – AGENDA BASE - Abertura da agenda: 09h20</h2> 

        <p>Busque evoluir para SuperFox e tenha benefícios exclusivos!</p>

        <ul>
            <li><span class="ar">AR (rotas aceitas) =</span> MAIOR OU IGUAL A <span class="valor">95%</span></li>
            <li><span class="caa">CAA (cancelamento após aceite) =</span> MENOR OU IGUAL A <span class="valor">1%</span></li>
            <li><span class="overtime">OVERTIME (atraso na entrega) =</span> <span class="valor">1%</span></li>
        </ul>

        <p class="aviso">
        ⚠️ LEMBRANDO QUE<br>
        Essa avaliação serve apenas para manter sua prioridade na agenda.<br>
        Não é cobrança — são orientações para melhorar seu desempenho.<br>
        Você é prestador de serviço e tem autonomia total.
        </p>

        <p>Nós Verificamos também: ✴️ Compromisso com as agendas; ✴️ Média de produtividade</p>
        <p>Continue firme! 🦊🔥</p>
    `;
}


    document.getElementById("mensagemExtras").innerHTML = bloco;
}

function sair() {
    localStorage.clear();
    window.location.href = "index.html";
}

// AUTO LOGOUT
let tempoLimite = 10 * 60 * 1000;
let timer = setTimeout(sair, tempoLimite);

function resetTimer() {
    clearTimeout(timer);
    timer = setTimeout(sair, tempoLimite);
}

window.addEventListener("mousemove", resetTimer);
window.addEventListener("keydown", resetTimer);
window.addEventListener("click", resetTimer);

carregarDados();
</script>

</body>
</html>
